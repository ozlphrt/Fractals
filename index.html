<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050608">
    <meta name="color-scheme" content="dark">
    <title>3D Fractal Synth — Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
    <link rel="stylesheet" href="css/cockpit.css?v=1.0.4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container">
        <canvas id="fractal-canvas"></canvas>
    </div>

    <!-- Minimalist Studio UI -->
    <div class="studio-ui" id="studio-ui">
        
        <!-- Hidden Select Dropdowns for programmatic state management -->
        <select id="formula-select" style="display: none;"></select>
        <select id="palette-preset-select" style="display: none;"></select>

        <!-- Bottom-Left FPS Status Indicator -->
        <div class="bottom-left-hud" id="bottom-left-fps-hud" title="Render Performance">
            <span class="fps-dot"></span>
            <span class="fps-val" id="hud-fps">60</span>
            <span class="fps-unit">FPS</span>
        </div>

        <!-- Bottom-Right Action Dock: Reset Zoom Camera, Settings & Dice Buttons -->
        <div class="bottom-action-dock">
            <!-- Manual Zoom Reset Camera Button (Hidden until user overrides zoom factor) -->
            <button class="dock-btn dock-camera-btn" id="btn-reset-zoom" title="Reset to Default Auto-Zoom (80% Fit)" aria-label="Reset Zoom">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </button>
            <!-- Simplified Settings Button (Gear) -->
            <button class="dock-btn" id="btn-toggle-settings" aria-expanded="false" aria-controls="settings-drawer" title="Settings Menu" aria-label="Settings">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <!-- Simplified Dice Auto-Deform Button -->
            <button class="dock-btn dock-dice-btn" id="deform-dice-btn" title="Play keyframes with dice variations" aria-label="Keyframe Dice" aria-pressed="false">
                <span class="btn-icon">🎲</span>
            </button>
        </div>

        <!-- Unified Studio Settings Drawer (Toggled by Settings Button) -->
        <aside class="side-drawer drawer-left closed" id="settings-drawer" aria-label="Studio settings" inert>
            <!-- Mobile Sheet Grab Handle -->
            <div class="drawer-grab-handle"></div>

            <!-- Tabs Header -->
            <div class="drawer-tabs">
                <button class="d-tab-btn active" data-tab="tab-settings-quick">Quick</button>
                <button class="d-tab-btn" data-tab="tab-settings-geo">Geometry</button>
                <button class="d-tab-btn" data-tab="tab-settings-presets">Presets</button>
                <button class="d-tab-btn" data-tab="tab-settings-material">Material</button>
                <button class="d-tab-btn" data-tab="tab-settings-light">Lighting</button>
                <button class="d-tab-btn" data-tab="tab-settings-optics">Optics</button>
                <button class="d-tab-btn" data-tab="tab-settings-cam">Camera</button>
                <button class="d-tab-btn" data-tab="tab-settings-anim">Morph</button>
            </div>

            <div class="keyframe-transport" role="group" aria-label="Keyframe playback">
                <button type="button" class="keyframe-add" id="keyframe-add" aria-label="Add Keyframe" aria-keyshortcuts="K">Add Keyframe <kbd>K</kbd></button>
                <button class="flat-action-btn" id="keyframe-play" disabled>Play Loop</button>
                <button class="flat-action-btn" id="keyframe-export" title="Download every formula and tab as one JavaScript module" disabled>Export All JS</button>
                <button class="flat-action-btn" id="keyframe-import" title="Import user-keyframes.js module">Import JS</button>
                <input type="file" id="keyframe-file-input" accept=".js,application/javascript" style="display:none;">
                <label class="keyframe-shuffle"><input type="checkbox" id="keyframe-shuffle"> Shuffle</label>
                <span id="keyframe-status" aria-live="polite">0 keyframes</span>
                <div class="keyframe-editor" role="group" aria-label="Edit keyframes">
                    <select id="keyframe-select" aria-label="Keyframe to edit" disabled>
                        <option value="">No keyframes</option>
                    </select>
                    <button class="flat-action-btn" id="keyframe-edit" title="Load selected keyframe into the studio" disabled>Edit</button>
                    <button class="flat-action-btn" id="keyframe-save" title="Overwrite the selected keyframe with the current scene" disabled>Save</button>
                    <button class="flat-action-btn" id="keyframe-remove" title="Delete the selected keyframe" disabled>Delete</button>
                </div>
            </div>

            <div class="drawer-body">
                <!-- Tab: Quick Controls (Formula, Camera, Material, Folder) -->
                <div class="tab-pane active" id="tab-settings-quick">
                    <div class="drawer-group">

                        <div class="quick-control-card">
                            <div class="cycle-pill formula-pill quick-pill" id="formula-cycle-pill">
                                <button class="cycle-step-btn" id="formula-prev-btn" title="Previous Formula" aria-label="Previous Formula">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                                </button>
                                <button type="button" class="cycle-content" id="formula-cycle-btn" title="Click to Cycle Formula">
                                    <span class="cycle-eyebrow">
                                        <span class="cycle-dot dot-formula"></span>
                                        <span class="cycle-tag">FORMULA</span>
                                    </span>
                                    <span class="cycle-title" id="formula-name-display">1. Mandelbulb</span>
                                </button>
                                <button class="cycle-step-btn" id="formula-next-btn" title="Next Formula" aria-label="Next Formula">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="drawer-group">

                        <div class="quick-control-card">
                            <div class="cycle-pill camera-pill quick-pill" id="camera-cycle-pill">
                                <button class="cycle-step-btn" id="camera-prev-btn" title="Previous Camera Preset" aria-label="Previous Camera Preset">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                                </button>
                                <button type="button" class="cycle-content" id="camera-cycle-btn" title="Click to Cycle Camera Preset">
                                    <span class="cycle-eyebrow">
                                        <span class="cycle-dot dot-camera"></span>
                                        <span class="cycle-tag">CAMERA</span>
                                    </span>
                                    <span class="cycle-title" id="camera-name-display">Turntable</span>
                                </button>
                                <button class="cycle-step-btn" id="camera-next-btn" title="Next Camera Preset" aria-label="Next Camera Preset">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="drawer-group">

                        <div class="quick-control-card">
                            <div class="cycle-pill material-pill quick-pill" id="material-cycle-pill">
                                <button class="cycle-step-btn" id="material-prev-btn" title="Previous Material" aria-label="Previous Material">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                                </button>
                                <button type="button" class="cycle-content" id="material-cycle-btn" title="Click to Cycle Material">
                                    <span class="cycle-eyebrow">
                                        <span class="cycle-dot dot-material"></span>
                                        <span class="cycle-tag">MATERIAL</span>
                                    </span>
                                    <span class="cycle-title" id="material-name-display">Dark Loam</span>
                                </button>
                                <button class="cycle-step-btn" id="material-next-btn" title="Next Material" aria-label="Next Material">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="drawer-group">

                        <button class="gallery-action-btn primary quick-folder-btn" id="btn-toggle-gallery" aria-expanded="false" aria-controls="gallery-drawer" title="Community Folder & Creations" aria-label="Open Creations Folder">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span>Open Creations Folder</span>
                        </button>
                    </div>
                </div>

                <!-- Tab: Geometry Sliders -->
                <div class="tab-pane" id="tab-settings-geo">
                    <details class="drawer-group camera-pose-panel" id="camera-pose-panel">
                        <summary class="camera-pose-heading">Camera Pose</summary>
                        <div class="keyframe-slider-actions camera-pose-actions" id="camera-pose-actions" role="group" aria-label="Whole camera pose keyframe controls" hidden>
                            <button type="button" class="keyframe-slider-button" id="camera-pose-previous" aria-label="Copy previous camera pose" title="Copy previous camera pose">P</button>
                            <button type="button" class="keyframe-slider-button" id="camera-pose-next" aria-label="Copy next camera pose" title="Copy next camera pose">N</button>
                            <button type="button" class="keyframe-slider-button" id="camera-pose-delete" aria-label="Delete all camera pose values">Delete</button>
                        </div>
                        <div class="sliders-stack" id="camera-pose-sliders"></div>
                    </details>
                    <div class="drawer-group">
                        <div class="group-header-row">
                            <div>
                                <label class="group-label">Geometry Parameters</label>
                                <span class="sub-label" id="hud-formula-sub">Spherical 3D Fold</span>
                            </div>
                            <button class="capture-values-btn" id="btn-capture-formula-values" title="Capture & Copy active formula values to clipboard">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                <span>Capture Values</span>
                            </button>
                        </div>
                        <div class="sliders-stack" id="formula-params-container"></div>
                    </div>
                </div>

                <!-- Tab: Curated Presets -->
                <div class="tab-pane" id="tab-settings-presets">
                    <div class="drawer-group">
                        <label class="group-label">Curated Starting States</label>
                        <div class="presets-flow" id="presets-grid"></div>
                    </div>
                </div>

                <!-- Tab: Material & Surface Shading -->
                <div class="tab-pane" id="tab-settings-material">
                    <div class="drawer-group">
                        <label class="group-label">Natural Geological Materials</label>
                        <div class="material-presets-grid" id="material-presets-grid"></div>
                    </div>
                    <div class="drawer-group">
                        <label class="group-label">Surface Shading & Texture</label>
                        <div class="sliders-stack" id="material-shading-container"></div>
                    </div>
                    <div class="drawer-group">
                        <label class="group-label">Cosine Palette Color Harmonics</label>
                        <div class="sliders-stack" id="material-palette-container"></div>
                    </div>
                </div>

                <!-- Tab: Lighting Studio -->
                <div class="tab-pane" id="tab-settings-light">
                    <!-- Light 1: Key Directional Sun -->
                    <div class="drawer-group light-card">
                        <div class="group-header-row">
                            <label class="group-label">
                                <span class="light-badge light-badge-sun">☀️ Light 1</span>
                                Key Directional Sun
                            </label>
                            <button class="light-toggle-pill active" id="btn-toggle-light-sun" title="Toggle Key Sun Light">ON</button>
                        </div>
                        <div class="sliders-stack" id="light-sun-container"></div>
                    </div>

                    <!-- Light 2: Rim / Backlight -->
                    <div class="drawer-group light-card">
                        <div class="group-header-row">
                            <label class="group-label">
                                <span class="light-badge light-badge-rim">💎 Light 2</span>
                                Rim / Backlight
                            </label>
                            <button class="light-toggle-pill active" id="btn-toggle-light-rim" title="Toggle Rim Backlight">ON</button>
                        </div>
                        <div class="sliders-stack" id="light-rim-container"></div>
                    </div>

                    <!-- Light 3: Environment & Ambient Occlusion -->
                    <div class="drawer-group light-card">
                        <div class="group-header-row">
                            <label class="group-label">
                                <span class="light-badge light-badge-env">🌫️ Ambient</span>
                                Occlusion & Depth Fog
                            </label>
                        </div>
                        <div class="sliders-stack" id="light-env-container"></div>
                    </div>

                    <!-- Light 4: Volumetric Core Glow -->
                    <div class="drawer-group light-card">
                        <div class="group-header-row">
                            <label class="group-label">
                                <span class="light-badge light-badge-glow">✨ Core Glow</span>
                                Volumetric Emission
                            </label>
                            <button class="light-toggle-pill" id="btn-toggle-light-glow" title="Toggle Core Glow">OFF</button>
                        </div>
                        <div class="sliders-stack" id="light-glow-container"></div>
                    </div>
                </div>

                <!-- Tab: Raymarching Optics & Atmosphere -->
                <div class="tab-pane" id="tab-settings-optics">
                    <div class="drawer-group">
                        <label class="group-label">Optics & Rendering Quality</label>
                        <div class="sliders-stack" id="optics-params-container"></div>
                    </div>
                </div>

                <!-- Tab: Camera & Motion -->
                <div class="tab-pane" id="tab-settings-cam">
                    <div class="drawer-group">
                        <label class="group-label">Camera Presets</label>
                        <div class="camera-presets-grid" id="camera-presets-grid">
                            <button class="cam-preset-btn active" data-preset="turntable">
                                <span class="cam-preset-title">Turntable</span>
                                <span class="cam-preset-desc">Majestic 360 Orbit</span>
                            </button>
                            <button class="cam-preset-btn" data-preset="action">
                                <span class="cam-preset-title">Action Cam</span>
                                <span class="cam-preset-desc">Dynamic Chase & Shake</span>
                            </button>
                            <button class="cam-preset-btn" data-preset="flyby">
                                <span class="cam-preset-title">Fly-By Cam</span>
                                <span class="cam-preset-desc">Lissajous Slalom</span>
                            </button>
                            <button class="cam-preset-btn" data-preset="follow">
                                <span class="cam-preset-title">Follow Cam</span>
                                <span class="cam-preset-desc">Close Surface Contour</span>
                            </button>
                            <button class="cam-preset-btn" data-preset="dynamic">
                                <span class="cam-preset-title">Dynamic Cam</span>
                                <span class="cam-preset-desc">Vortex Core Spiral Dive</span>
                            </button>
                            <button class="cam-preset-btn" data-preset="hero">
                                <span class="cam-preset-title">Hero Shot</span>
                                <span class="cam-preset-desc">Low-Angle Monolith</span>
                            </button>
                        </div>
                    </div>

                    <div class="drawer-group">
                        <label class="group-label">Lens & Optics</label>
                        <div class="sliders-stack" id="cam-params-container"></div>
                    </div>

                    <div class="drawer-group">
                        <label class="group-label">Auto-Rotation (Multi-Axis)</label>
                        <div class="button-row">
                            <button class="toggle-action-btn active" id="auto-rotate-btn">
                                <span class="indicator-dot"></span>
                                <span>Multi-Axis Orbit</span>
                            </button>
                            <button class="flat-action-btn" id="cam-reset-btn">Reset View</button>
                        </div>
                    </div>
                </div>

                <!-- Tab: Audio & Morphing Transport -->
                <div class="tab-pane" id="tab-settings-anim">
                    <!-- History & Undo/Redo -->
                    <div class="drawer-group">
                        <label class="group-label">History Actions</label>
                        <div class="button-row">
                            <button class="flat-action-btn" id="undo-btn" title="Undo change (Ctrl+Z)">↶ Undo</button>
                            <button class="flat-action-btn" id="redo-btn" title="Redo change (Ctrl+Y)">↷ Redo</button>
                        </div>
                    </div>

                    <!-- A/B Morph Crossfader -->
                    <div class="drawer-group">
                        <label class="group-label">A / B Morph Transition</label>
                        <div class="button-row" style="margin-bottom: 10px;">
                            <button class="flat-action-btn" id="snap-a-btn" title="Store State A">Snap A</button>
                            <button class="flat-action-btn" id="snap-b-btn" title="Store State B">Snap B</button>
                        </div>
                        <div class="morph-track-container" style="display: flex; flex-direction: column; gap: 6px;">
                            <span class="sub-label">A ➔ B Crossfade</span>
                            <input type="range" class="morph-fader" id="morph-slider" min="0.0" max="1.0" step="0.01" value="0.0" style="width: 100%;">
                        </div>
                    </div>

                    <!-- Audio Reactivity -->
                    <div class="drawer-group">
                        <div class="group-header-row">
                            <label class="group-label">Audio Reactivity</label>
                            <div class="eq-mini-stack" title="Sub-Bass / Low-Mid / High-Mid / Treble">
                                <div class="eq-col" id="eq-bar-bass"></div>
                                <div class="eq-col" id="eq-bar-lowmid"></div>
                                <div class="eq-col" id="eq-bar-highmid"></div>
                                <div class="eq-col" id="eq-bar-treble"></div>
                            </div>
                        </div>
                        <div class="button-row" style="margin-top: 10px;">
                            <button class="toggle-action-btn" id="audio-synth-btn" title="Built-in Generative Synth Beat">
                                <span class="indicator-dot"></span>
                                <span>🎵 Groove</span>
                            </button>
                            <button class="toggle-action-btn" id="audio-mic-btn" title="Live Microphone">
                                <span class="indicator-dot"></span>
                                <span>🎙️ Mic</span>
                            </button>
                            <label class="flat-action-btn" style="cursor: pointer; text-align: center; margin: 0; padding: 7px 10px;" title="Load Audio File">
                                <span>📁 File</span>
                                <input type="file" id="audio-file-input" accept="audio/*" style="display: none;">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Slide-out Right Drawer: Community Folder & Creations Showcase -->
        <aside class="side-drawer drawer-right closed" id="gallery-drawer" aria-label="Community Creations Folder" inert>
            <div class="drawer-header">
                <div class="drawer-title-row">
                    <div class="drawer-icon-badge">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    </div>
                    <div>
                        <h2 class="drawer-title">Creations Folder</h2>
                        <span class="drawer-subtitle">Community Showcase & Share</span>
                    </div>
                </div>
                <button class="drawer-close-btn" id="btn-close-gallery" title="Close Drawer" aria-label="Close Folder">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="gallery-drawer-body">
                <!-- Dynamically populated by GalleryManager -->
            </div>
        </aside>

    </div>

    <!-- Modulation Popover -->
    <div class="popover hidden" id="mod-popover">
        <div class="popover-header">
            <span>Modulate: <strong id="mod-target-name">Parameter</strong></span>
            <button class="icon-btn" id="mod-close-btn">&times;</button>
        </div>
        <div class="popover-body">
            <label>Modulation Source</label>
            <select id="mod-source">
                <option value="none">Disabled (Manual)</option>
                <option value="lfo">LFO Waveform</option>
                <option value="audio">Audio Frequency Band</option>
            </select>

            <div id="mod-lfo-panel" style="display: none;">
                <label>Waveform</label>
                <select id="lfo-wave">
                    <option value="sine">Sine</option>
                    <option value="triangle">Triangle</option>
                    <option value="saw">Sawtooth</option>
                    <option value="noise">Smooth Organic Drift</option>
                </select>
                <label>Frequency (Hz)</label>
                <input type="range" id="lfo-rate" min="0.05" max="3.0" step="0.05" value="0.5">
                <label>Depth</label>
                <input type="range" id="lfo-depth" min="0.05" max="1.0" step="0.05" value="0.35">
            </div>

            <div id="mod-audio-panel" style="display: none;">
                <label>Frequency Band</label>
                <select id="audio-band">
                    <option value="bass">Sub-Bass (Kick/Pounding)</option>
                    <option value="lowMid">Low-Mid (Bassline/Warmth)</option>
                    <option value="highMid">High-Mid (Snare/Lead)</option>
                    <option value="treble">Treble (Hi-Hats/Crisp)</option>
                </select>
                <label>Gain Sensitivity</label>
                <input type="range" id="audio-gain" min="0.2" max="3.0" step="0.1" value="1.0">
            </div>
        </div>
    </div>

    <!-- Transient Studio Feedback Toast -->
    <div class="studio-toast" id="studio-toast" role="status" aria-live="polite"></div>
    <p id="graphics-status" class="graphics-status" role="status" hidden></p>

    <!-- Application Script -->
    <script type="module" src="js/main.js?v=1.0.4"></script>
</body>
</html>
